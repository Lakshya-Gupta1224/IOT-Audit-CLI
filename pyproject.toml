[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-audit-cli"
version = "0.1.0"
description = "Automated IoT Security Posture & Vulnerability Assessment Framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lakshya Gupta" }]
keywords = ["iot", "security", "mqtt", "rtsp", "owasp", "pentest", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "scapy>=2.5.0",
    "paho-mqtt>=2.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "aiocoap>=0.4.7",
    "jinja2>=3.1.4",
    "manuf>=1.1.5",
]

[project.scripts]
iot-audit = "iot_audit.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["iot_audit*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

